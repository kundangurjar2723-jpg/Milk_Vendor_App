<style>

splay:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.action{text-align:left;background:#f8fbf9;color:var(--ink);border:1px solid var(--line);white-space:normal}.action span{display:block;font-size:22px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{max-width:260px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}th,td{padding:10px;border-bottom:1px solid #edf1ee;text-align:left;vertical-align:top}th{background:#f5f8f6;color:#53625b;font-size:12px;white-space:nowrap}.num{text-align:right}.pill{display:inline-block;background:#edf2ef;border-radius:99px;padding:3px 8px;font-size:12px}.good{background:#e0f5e8;color:#176b55}.warn{background:#fff0d2;color:#8c5c00}.bad{background:#ffebe9;color:#b42318}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{background:#fff4db;color:#805500;border-radius:10px;padding:11px;font-size:13px;margin:10px 0}.empty{padding:25px;text-align:center;color:var(--muted)}.bottom{display:none}.modalback{position:fixed;inset:0;background:#14251dd9;display:grid;place-items:center;z-index:20;padding:12px}.modal{background:white;border-radius:15px;padding:18px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h3{margin-top:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17231f;color:white;padding:12px 17px;border-radius:10px;z-index:30;max-width:90vw}.footer{text-align:center;color:var(--muted);font-size:12px;padding:15px}

.invoice-theme{--inv-primary:#176b55;--inv-secondary:#e5f3ec;--inv-accent:#145342;--inv-table:#176b55;color:#17231f;background:#fff;border:1px solid #dce5df;border-radius:12px;padding:22px;overflow:hidden}.invoice-theme .inv-head{display:flex;justify-content:space-between;gap:18px;padding:16px;margin:-22px -22px 18px;background:var(--inv-primary);color:#fff;border-bottom:5px solid var(--inv-accent)}.invoice-theme .inv-head.light{background:var(--inv-secondary);color:#17231f;border-bottom:4px solid var(--inv-primary)}.invoice-theme .inv-head.minimal{background:#fff;color:#17231f;border-bottom:2px solid var(--inv-primary)}.invoice-theme .inv-brand{min-width:0}.invoice-theme .inv-brand h2{margin:0 0 5px;font-size:22px;overflow-wrap:anywhere}.invoice-theme .inv-meta{text-align:right;min-width:130px}.invoice-theme .inv-badge{display:inline-block;background:var(--inv-accent);color:#fff;padding:5px 10px;border-radius:6px;font-weight:750;margin:4px 0}.invoice-theme .inv-head.light .inv-badge,.invoice-theme .inv-head.minimal .inv-badge{background:var(--inv-primary);color:#fff}.invoice-theme .inv-customer{background:var(--inv-secondary);border-left:4px solid var(--inv-primary);padding:12px;border-radius:7px;margin-bottom:14px;overflow-wrap:anywhere}.invoice-theme .tablewrap{border-color:var(--inv-secondary)}.invoice-theme table{min-width:0;font-size:13px}.invoice-theme th{background:var(--inv-table);color:#fff;white-space:normal}.invoice-theme td,.invoice-theme th{padding:8px 7px;overflow-wrap:anywhere}.invoice-theme tbody tr:nth-child(even){background:color-mix(in srgb,var(--inv-secondary) 38%,white)}.invoice-theme .inv-totalbox{max-width:390px;margin:16px 0 0 auto;border:1px solid var(--inv-secondary);border-radius:8px;overflow:hidden}.invoice-theme .inv-totalrow{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid #e8ece9}.invoice-theme .inv-totalrow:last-child{border-bottom:0}.invoice-theme .inv-grand{background:var(--inv-primary);color:#fff;font-size:18px;font-weight:800}.invoice-theme .inv-footer{border-top:2px solid var(--inv-secondary);margin-top:22px;padding-top:12px;text-align:center;overflow-wrap:anywhere}.theme-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.theme-choice{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;color:#17231f;border:1px solid #dce5df;padding:10px;min-height:68px}.theme-choice.selected{outline:3px solid var(--inv-primary);border-color:var(--inv-primary)}.theme-swatch{display:flex;flex-shrink:0;width:54px;height:38px;border-radius:7px;overflow:hidden;border:1px solid #ddd}.theme-swatch i{display:block;flex:1}.invoice-preview-shell{background:#f2f4f3;border-radius:10px;padding:12px;overflow:auto}.invoice-preview-shell .invoice-theme{max-width:760px;margin:auto;box-shadow:0 4px 18px #00000012;font-size:13px}.invoice-preview-shell .invoice-theme .inv-brand h2{font-size:18px}
@media(max-width:520px){.theme-options{grid-template-columns:1fr}.invoice-theme{padding:14px}.invoice-theme .inv-head{margin:-14px -14px 14px;padding:12px;gap:8px}.invoice-theme .inv-brand h2{font-size:17px}.invoice-theme .inv-meta{min-width:105px;font-size:12px}.invoice-theme table{font-size:11px}.invoice-theme td,.invoice-theme th{padding:6px 4px}.invoice-theme .inv-grand{font-size:16px}}
@media print{.invoice-theme{border:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.invoice-theme .inv-head{margin:0 0 14px;padding:12px}.invoice-theme .tablewrap{overflow:visible}.invoice-theme table{width:100%;min-width:0;table-layout:auto}.invoice-theme th{print-color-adjust:exact;-webkit-print-color-adjust:exact}.invoice-theme tr{break-inside:avoid;page-break-inside:avoid}.invoice-theme .inv-totalbox{break-inside:avoid;page-break-inside:avoid}}

</style></head><body>
<header class="head"><div><h1 id="title">🥛 दूध का हिसाब</h1><div id="subtitle" style="font-size:12px;opacity:.85">दूध व्यवसाय • आसान हिसाब-किताब</div></div><div style="display:flex;gap:7px"><button id="lang">English</button><button id="backup">⬇ बैकअप</button></div></header>
<div class="wrap"><div class="layout"><nav class="nav" id="nav"></nav><main class="content" id="app"></main></div></div><nav class="bottom" id="bottom"></nav><div id="modal"></div><div id="toast"></div><div class="footer" id="footer">ऑफलाइन ऐप • डेटा इसी ब्राउज़र में सेव होता है • नियमित बैकअप लें</div>
<script>
'use strict';
const DBN='MilkLedgerDB',VER=2,defs={customers:{keyPath:'id',autoIncrement:true},suppliers:{keyPath:'id',autoIncrement:true},deliveries:{keyPath:'id',autoIncrement:true},purchases:{keyPath:'id',autoIncrement:true},expenses:{keyPath:'id',autoIncrement:true},payments:{keyPath:'id',autoIncrement:true},moves:{keyPath:'id',autoIncrement:true},invoices:{keyPath:'id',autoIncrement:true},audit:{keyPath:'id',autoIncrement:true},settings:{keyPath:'key'},products:{keyPath:'id',autoIncrement:true},production:{keyPath:'id',autoIncrement:true}};
let db,lang='hi',page='home',draftInvoice=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)],today=()=>new Date().toISOString().slice(0,10);
const T=(h,e)=>lang==='hi'?h:e, M=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),Q=n=>(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:3})+' L',D=d=>d?String(d).slice(8,10)+'/'+String(d).slice(5,7)+'/'+String(d).slice(0,4):'—',E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const invoiceThemes={green:{name:'Fresh Dairy Green',primary:'#176b55',secondary:'#e5f3ec',accent:'#145342',table:'#176b55'},blue:{name:'Premium Royal Blue',primary:'#173b73',secondary:'#e7effb',accent:'#102b55',table:'#234f91'},purple:{name:'Elegant Purple',primary:'#603b83',secondary:'#f0e8f8',accent:'#472561',table:'#68418b'},orange:{name:'Warm Orange',primary:'#b85b16',secondary:'#fff0df',accent:'#8d3e0b',table:'#c56a20'},gold:{name:'Luxury Black & Gold',primary:'#222222',secondary:'#f5f0e2',accent:'#a88432',table:'#333333'},classic:{name:'Classic Professional',primary:'#475569',secondary:'#f1f5f9',accent:'#334155',table:'#475569'},modern:{name:'Colourful Modern',primary:'#087e8b',secondary:'#e3f7f5',accent:'#5b3f91',table:'#087e8b'}};
function themeOf(p={}){let id=invoiceThemes[p.invoiceTheme]?p.invoiceTheme:'green',t=invoiceThemes[id];return {id,primary:p.themePrimary||t.primary,secondary:p.themeSecondary||t.secondary,accent:p.themeAccent||t.accent,table:p.themeTable||t.table,header:p.invoiceHeaderStyle||'colour',logoPosition:p.logoPosition||'left',density:p.invoiceDensity||'normal',border:p.invoiceBorder||'soft'}}
function themeVars(p={}){let t=themeOf(p);return `--inv-primary:${E(t.primary)};--inv-secondary:${E(t.secondary)};--inv-accent:${E(t.accent)};--inv-table:${E(t.table)};`}
const nav=[['home','🏠','होम','Home'],['customers','👥','ग्राहक','Customers'],['deliveries','🥛','डिलीवरी','Deliveries'],['suppliers','🚚','सप्लायर','Suppliers'],['purchases','📦','दूध खरीद','Purchases'],['expenses','🧾','खर्च','Expenses'],['payments','💳','लेन-देन','Payments'],['inventory','🛢️','स्टॉक','Stock'],['production','🧀','प्रोडक्शन','Production'],['invoices','📄','बिल','Invoices'],['reports','📊','रिपोर्ट','Reports'],['settings','⚙️','सेटिंग','Settings']];
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DBN,VER);r.onupgradeneeded=()=>{let d=r.result;Object.entries(defs).forEach(([n,c])=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,c)})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onblocked=()=>console.warn('Database upgrade blocked by another open tab')})}
function all(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
function get(s,k){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function save(s,o){return new Promise((ok,no)=>{let tx=db.transaction(s,'readwrite'),r=tx.objectStore(s).put(o);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function add(s,o){return new Promise((ok,no)=>{let tx=db.transaction(s,'readwrite'),r=tx.objectStore(s).add(o);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function clear(s){return new Promise((ok,no)=>{let tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
async function log(action,detail){await add('audit',{action,detail,at:new Date().toISOString()})}
function toast(s){$('#toast').innerHTML=`<div class="toast">${E(s)}</div>`;setTimeout(()=>$('#toast').innerHTML='',3000)}
function fail(e){console.error(e);toast(T('कुछ गड़बड़ हुई। कृपया दोबारा कोशिश करें।','Something went wrong. Please try again.'))}
function moneyField(label,name,value='',type='text',required=false){return `<div><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${E(value)}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></div>`}
function selectField(label,name,value,opts){return `<div><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${E(o[0])}" ${String(value)===String(o[0])?'selected':''}>${E(o[1])}</option>`).join('')}</select></div>`}
function buttons(label){return `<div class="formactions"><button type="submit">${label}</button><button type="button" class="alt" onclick="closeModal()">${T('रद्द करें','Cancel')}</button></div>`}
function modal(title,html){$('#modal').innerHTML=`<div class="modalback"><div class="modal"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${title}</h3><button class="alt" onclick="closeModal()">✕</button></div>${html}</div></div>`;$('#modal .modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()}}
function closeModal(){$('#modal').innerHTML=''}
function table(headers,rows,empty){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}
function head(h,s='',right=''){return `<div class="headrow"><div><h2>${h}</h2><div class="muted">${s}</div></div>${right}</div>`}
async function customers(active=false){let a=await all('customers');return active?a.filter(c=>c.active!==false):a}
async function suppliers(){return all('suppliers')}
async function cDue(id,through=today()){let [c,ds,ps]=await Promise.all([get('customers',id),all('deliveries'),all('payments')]);if(!c)return 0;return Number(c.opening||0)+ds.filter(d=>d.cid===id&&d.done&&d.date<=through).reduce((s,d)=>s+d.qty*d.rate,0)-ps.filter(p=>p.party==='c'&&p.pid===id&&p.date<=through&&p.kind==='in').reduce((s,p)=>s+p.amount,0)-ps.filter(p=>p.party==='c'&&p.pid===id&&p.date<=through&&p.kind==='credit').reduce((s,p)=>s+p.amount,0)}
async function sDue(id,through=today()){let [s,bu,ps]=await Promise.all([get('suppliers',id),all('purchases'),all('payments')]);if(!s)return 0;return Number(s.opening||0)+bu.filter(b=>b.sid===id&&b.date<=through).reduce((a,b)=>a+b.qty*b.rate,0)-ps.filter(p=>p.party==='s'&&p.pid===id&&p.date<=through&&p.kind==='out').reduce((a,p)=>a+p.amount,0)}
async function stockCalc(through=today()){let [ms,bu,ds,ps,prods]=await Promise.all([all('moves'),all('purchases'),all('deliveries'),all('production'),all('products')]),names=new Set([...ms.map(x=>x.product),...bu.map(x=>x.product),...ds.map(x=>x.product),...prods.map(x=>x.name)]),out={};for(let p of names){let master=prods.find(x=>x.name===p);out[p]=Number(master?.opening||0)+ms.filter(x=>x.product===p&&x.date<=through).reduce((s,x)=>s+(x.kind==='in'?Number(x.qty):-Number(x.qty)),0)+bu.filter(x=>x.product===p&&x.date<=through).reduce((s,x)=>s+Number(x.qty),0)-ds.filter(x=>x.product===p&&x.done&&x.date<=through).reduce((s,x)=>s+Number(x.qty),0);for(let batch of ps.filter(x=>x.date<=through&&x.status!=='cancelled')){out[p]+=(batch.outputs||[]).filter(x=>x.product===p).reduce((a,x)=>a+Number(x.qty),0);out[p]-=(batch.inputs||[]).filter(x=>x.product===p).reduce((a,x)=>a+Number(x.qty),0)}}return out}
async function metrics(){let [ds,bu,ex,ps,cs,ss,stock]=await Promise.all([all('deliveries'),all('purchases'),all('expenses'),all('payments'),customers(),suppliers(),stockCalc()]),td=today(),d=ds.filter(x=>x.date===td&&x.done),sales=d.reduce((s,x)=>s+x.qty*x.rate,0),litres=d.reduce((s,x)=>s+x.qty,0),expense=ex.filter(x=>x.date===td).reduce((s,x)=>s+x.amount,0),dueC=0,dueS=0;for(let c of cs)dueC+=await cDue(c.id);for(let s of ss)dueS+=await sDue(s.id);let allSales=ds.filter(x=>x.done&&x.date<=td).reduce((s,x)=>s+x.qty*x.rate,0),allEx=ex.filter(x=>x.date<=td).reduce((s,x)=>s+x.amount,0),buyCost=bu.filter(x=>x.date<=td).reduce((s,x)=>s+x.qty*x.rate,0),buyQty=bu.filter(x=>x.date<=td).reduce((s,x)=>s+x.qty,0),sold=ds.filter(x=>x.done&&x.date<=td).reduce((s,x)=>s+x.qty,0),profit=allSales-allEx-(buyQty?buyCost/buyQty*sold:0);return{sales,litres,expense,dueC,dueS,stock,profit,cs:cs.length}}
function setupNav(){let html=nav.map(([id,ico,h,e])=>`<button data-go="${id}" class="${page===id?'active':''}"><span>${ico}</span> ${T(h,e)}</button>`).join('');$('#nav').innerHTML=html;$('#bottom').innerHTML=html;$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
async function go(p){page=p;setupNav();try{await render()}catch(e){fail(e);$('#app').innerHTML=`<div class="panel">Error: ${E(e.message)}</div>`}}
async function render(){if(page==='home')return home();if(page==='customers')return customerPage();if(page==='deliveries')return deliveryPage();if(page==='suppliers')return supplierPage();if(page==='purchases')return purchasePage();if(page==='expenses')return expensePage();if(page==='payments')return paymentPage();if(page==='inventory')return inventoryPage();if(page==='production')return productionPage();if(page==='invoices')return invoicePage();if(page==='reports')return reportPage();if(page==='settings')return settingPage()}
